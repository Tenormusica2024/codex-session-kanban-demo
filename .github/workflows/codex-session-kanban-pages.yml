name: Codex Session Kanban Pages

on:
  workflow_dispatch:
    inputs:
      deploy_pages:
        description: "Also deploy to GitHub Pages. Requires Pages support for this repository."
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      run_browser_smoke:
        description: "Run optional Playwright browser smoke test against the built artifact."
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  push:
    branches:
      - master
    paths:
      - "codex_session_review/assets/**"
      - "codex_session_review/templates/**"
      - "codex_session_review/sample_data/**"
      - "codex_session_review/build_review_surface.py"
      - "codex_session_review/validate_session_data.py"
      - "codex_session_review/smoke_public_build.py"
      - "codex_session_review/smoke_browser_surface.mjs"
      - "docs/**"
      - "README.md"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/codex-session-kanban-pages.yml"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: codex-session-kanban-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate public fixture
        run: python codex_session_review/validate_session_data.py codex_session_review/sample_data/recent_sessions.sample.json --distribution

      - name: Build public fixture
        run: |
          mkdir -p codex_session_review/github_pages
          python codex_session_review/build_review_surface.py \
            --input-json codex_session_review/sample_data/recent_sessions.sample.json \
            --output codex_session_review/github_pages/index.html \
            --distribution
          cp -R docs codex_session_review/github_pages/docs
          touch codex_session_review/github_pages/.nojekyll
          cat > codex_session_review/github_pages/README_LOCAL_DEMO.txt <<'EOF'
          Codex Session Kanban

          This GitHub Pages build is generated from sample fixture data only.
          It must not contain real Codex sessions, local user paths, Vercel bypass tokens, or private project data.
          EOF

      - name: Smoke test public artifact
        run: python codex_session_review/smoke_public_build.py codex_session_review/github_pages/index.html --docs-dir codex_session_review/github_pages/docs --distribution

      - name: Package downloadable artifact zip
        run: |
          cd codex_session_review/github_pages
          zip -r ../codex-session-kanban.zip index.html README_LOCAL_DEMO.txt docs

      - name: Smoke test downloadable artifact zip
        run: python codex_session_review/smoke_distribution_package.py codex_session_review/codex-session-kanban.zip --distribution

      - name: Install browser smoke dependencies
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.run_browser_smoke == 'true') }}
        run: |
          npm ci
          npx playwright install chromium

      - name: Browser smoke test public artifact
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.run_browser_smoke == 'true') }}
        run: npm run smoke:browser -- --file codex_session_review/github_pages/index.html

      - name: Mobile browser smoke test public artifact
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.run_browser_smoke == 'true') }}
        run: npm run smoke:browser:mobile -- --file codex_session_review/github_pages/index.html

      - name: Narrow browser smoke test public artifact
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.run_browser_smoke == 'true') }}
        run: npm run smoke:browser:narrow -- --file codex_session_review/github_pages/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: codex_session_review/github_pages

      - name: Upload downloadable artifact
        uses: actions/upload-artifact@v7
        with:
          name: codex-session-kanban
          path: codex_session_review/codex-session-kanban.zip

  deploy:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy_pages == 'true') }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
