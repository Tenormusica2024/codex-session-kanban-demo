name: Bug report
description: Report a reproducible issue in the public fixture demo.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug.

        Do not paste real `.codex` logs, private task data, local user paths, tokens, cookies, API keys, credentials, passwords, secrets, or bypass URLs.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the visible behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the public demo
        2. Click ...
        3. Observe ...
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - GitHub Pages public demo
        - Downloaded Actions artifact
        - Local fixture build
        - Imported local JSON
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: Checks run
      description: Paste non-sensitive output from `npm run release:check` or browser smoke if available.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I did not include private logs, secrets, credentials, local paths, or personal/client data.
          required: true
